<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator PPN 11% Sederhana</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Kalkulator PPN (11%)</h2>

        <!-- Input Harga DPDP (Sebelum PPN) -->
        <div class="mb-4">
            <label for="harga" class="block text-sm font-medium text-gray-700 mb-1">Harga Awal (Rp)</label>
            <input 
                type="number" 
                id="harga" 
                placeholder="Masukkan nominal harga..." 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                oninput="hitungPPN()"
            >
        </div>

        <!-- Hasil Perhitungan -->
        <div class="bg-gray-50 p-4 rounded-lg space-y-3 border border-gray-200">
            <div class="flex justify-between items-center text-sm">
                <span class="text-gray-600">Besar PPN (11%):</span>
                <span id="nominalPPN" class="font-semibold text-gray-800">Rp 0</span>
            </div>
            <hr class="border-gray-200">
            <div class="flex justify-between items-center text-base font-bold">
                <span class="text-gray-800">Total + PPN:</span>
                <span id="totalHarga" class="text-blue-600">Rp 0</span>
            </div>
        </div>
    </div>

<script src = ".script.js"></script>

</body>
</html>
